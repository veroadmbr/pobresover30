<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>Entrar no Pobres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pobres.css">
<style>
/* VOICE: porta de entrada sóbria
   IDEA: a página de acesso de uma revista por assinatura
   PICTURE: o selo Over 30 sobre a ficha de login
   COLOUR and TYPE: branco, preto; Playfair + Work Sans
   LAYOUT: coluna única centralizada */
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Work Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:440px;margin:0 auto;padding:clamp(32px,7vw,72px) 20px 48px}
.seal{width:170px;margin:0 auto 26px}
.seal img{display:block;width:100%;height:auto}
h1{font:400 clamp(30px,4.4vw,38px)/1.1 "Playfair Display",Georgia,serif;margin:0;text-align:center}
.sub{color:var(--mut);text-align:center;margin:10px 0 28px}
.btn.full{width:100%}
.row{display:flex;justify-content:flex-end;margin:-6px 0 14px}
.alt{text-align:center;font-size:14px;color:var(--mut);margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.alt a{color:var(--ink);font-weight:600}
.ok{color:var(--up);font-size:13px;margin-top:8px;min-height:18px}
.forgot{display:none;font-size:13px;color:var(--mut);background:var(--soft);padding:12px 14px;border-radius:8px;margin-bottom:14px}.forgot.on{display:block}
</style>
</head>
<body>
<header class="hd"><div class="hb"><a href="index.html" class="logo">Pobres</a><div class="acct" id="acct"></div></div></header>
<main>
  <div class="seal"><img class="lg30" src="img/pobres-over30.svg" alt="Pobres Over 30"></div>
  <div id="vLogin">
  <h1>Entre na sua conta</h1>
  <p class="sub">Para ver e editar sua página Pobres Over 30.</p>
  <form id="f" novalidate>
    <label class="field"><span class="lb">E-mail</span><input class="inp" id="em" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com"></label>
    <label class="field"><span class="lb">Senha</span><span class="pw"><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Sua senha"><button type="button" class="eye" data-t="pw" aria-label="Mostrar senha"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <div class="row"><button type="button" class="lnk" id="fg">Esqueci a senha</button></div>
    <button class="btn full" id="go">Entrar</button>
    <div class="err" id="err" aria-live="polite"></div>
  </form>
  <p class="alt">Ainda não está na lista? <a href="inscricao.html">Inscreva-se</a></p>
  </div>
  <div id="vEsq" hidden>
  <h1>Esqueceu a senha?</h1>
  <p class="sub">Digite o e-mail da sua conta. Enviamos um link para você criar uma senha nova.</p>
  <form id="fE" novalidate>
    <label class="field"><span class="lb">E-mail</span><input class="inp" id="eE" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com"></label>
    <button class="btn full" id="goE">Enviar link</button>
    <div class="err" id="errE" aria-live="polite"></div>
    <div class="ok" id="okE" aria-live="polite"></div>
  </form>
  <p class="alt"><button type="button" class="lnk" id="volta">Voltar para o login</button></p>
  </div>
  <div id="vRed" hidden>
  <h1>Crie uma senha nova</h1>
  <p class="sub">Use pelo menos 8 caracteres.</p>
  <form id="fR" novalidate>
    <label class="field"><span class="lb">Nova senha</span><span class="pw"><input class="inp" id="r1" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"><button type="button" class="eye" data-t="r1" aria-label="Mostrar senha"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <label class="field"><span class="lb">Confirme a nova senha</span><span class="pw"><input class="inp" id="r2" type="password" autocomplete="new-password" placeholder="Repita a senha"><button type="button" class="eye" data-t="r2" aria-label="Mostrar senha"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <button class="btn full" id="goR">Salvar nova senha</button>
    <div class="err" id="errR" aria-live="polite"></div>
  </form>
  </div>
</main>
<script src="js/conta.js"></script>
<script src="js/analytics.js"></script>
<script>
Conta.pronto.then(()=>{
const $=s=>document.querySelector(s);
const tok=(location.hash.match(/^#r-([a-f0-9]{20,})$/)||[])[1];
const ver=v=>{['vLogin','vEsq','vRed'].forEach(k=>$('#'+k).hidden=k!==v)};
if(tok)ver('vRed');else if(Conta.atual())location.replace('perfil.html');
document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.t);i.type=i.type==='password'?'text':'password';b.setAttribute('aria-label',i.type==='password'?'Mostrar senha':'Esconder senha')});
$('#fg').onclick=()=>{ver('vEsq');$('#eE').value=$('#em').value;$('#eE').focus()};
$('#volta').onclick=()=>ver('vLogin');
$('#f').onsubmit=async e=>{
  e.preventDefault();$('#err').textContent='';
  const em=$('#em').value,pw=$('#pw').value;
  if(!em.trim()||!pw){$('#err').textContent='Preencha e-mail e senha.';return}
  $('#go').disabled=true;$('#go').textContent='Entrando...';
  try{await Conta.entrar(em,pw);window.Metricas&&Metricas.track('login');location.href='perfil.html'}
  catch(x){$('#err').textContent=x.message;$('#go').disabled=false;$('#go').textContent='Entrar'}
};
$('#fE').onsubmit=async e=>{
  e.preventDefault();$('#errE').textContent='';$('#okE').textContent='';
  const em=$('#eE').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){$('#errE').textContent='Digite um e-mail válido.';return}
  $('#goE').disabled=true;
  try{const r=await Conta.esqueci(em);
    if(r.configurado)$('#okE').textContent='Se esse e-mail estiver cadastrado, você vai receber o link em instantes. Confira também o spam.';
    else $('#errE').textContent='A recuperação por e-mail ainda não está ativada no site. Fale com o suporte.'}
  catch(x){$('#errE').textContent=x.message}
  $('#goE').disabled=false;
};
$('#fR').onsubmit=async e=>{
  e.preventDefault();$('#errR').textContent='';
  const a=$('#r1').value,b=$('#r2').value;
  if(a.length<8){$('#errR').textContent='A senha precisa ter pelo menos 8 caracteres.';return}
  if(a!==b){$('#errR').textContent='As senhas não são iguais.';return}
  $('#goR').disabled=true;
  try{await Conta.redefinir(tok,a);history.replaceState(null,'',location.pathname);location.href='perfil.html'}
  catch(x){$('#errR').textContent=x.message;$('#goR').disabled=false}
};
});
</script>
</body>
</html>
