<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil Pobres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pobres.css">
<style>
/* VOICE: página de perfil de revista, como o verbete de um ranking
   IDEA: a ficha de um nome da lista Over 30
   PICTURE: foto quadrada grande ao lado do nome, selo da lista acima
   COLOUR and TYPE: branco, preto, verde e vermelho só na cotação; Playfair + Work Sans
   LAYOUT: faixa do selo, ficha em duas colunas, edição no lugar da ficha */
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Work Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:400;margin:0;line-height:1.08;text-wrap:balance}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
.band{background:#fff;border-bottom:1px solid var(--line);padding:26px 20px;display:flex;justify-content:center}
.band img{width:clamp(140px,18vw,200px);height:auto;display:block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--mut)}.crumb a{color:var(--ink)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .btn{height:42px;padding:0 20px;font-size:14px}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(24px,4vw,52px);padding:10px 0 52px;align-items:start}
.pic .ph{border-radius:4px}
.pic .ph>svg{width:40%}
.mk{position:absolute;right:14px;top:14px;height:38px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:14px;font-weight:700}
.mk.up{color:var(--up)}.mk.dn{color:var(--dn)}
.tag{display:inline-block;font:600 10px "Work Sans";text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:2px solid var(--dn);margin-bottom:16px}
.info h1{font-size:clamp(36px,5vw,58px);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;color:var(--mut);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.area{display:inline-block;margin-top:16px;padding:7px 14px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600}
blockquote{margin:28px 0 0;font:400 clamp(21px,2.4vw,26px)/1.35 "Playfair Display",Georgia,serif}
.bio{margin:18px 0 0;max-width:60ch;white-space:pre-line}
.empty{color:var(--mut);font-style:italic}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:30px}
.facts div{padding:14px 14px 14px 0;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.facts div+div{padding-left:14px;border-left:1px solid var(--line)}
.facts b{display:block;font:600 22px/1.2 "Playfair Display",Georgia,serif;text-transform:none;letter-spacing:0;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.ig{display:inline-block;margin-top:18px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* edição */
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(24px,4vw,52px);padding:10px 0 52px}
.edit .pic{display:grid;gap:12px;align-content:start}
.fileb{position:relative;overflow:hidden}.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.two{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}.two.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sug{margin:-4px 0 18px}.sug-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;margin-bottom:8px}
#opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;font:14px/1.5 "Work Sans",sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:light-dark(#b9b9b9,#444)}.opt.on{border-color:var(--ink);box-shadow:0 0 0 3px light-dark(rgba(0,0,0,.08),rgba(255,255,255,.12))}
.opt-n{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
.opt-c{display:block;font-size:12px;font-weight:600;margin-top:8px;text-decoration:underline;text-underline-offset:3px}.opt.on .opt-c{text-decoration:none;color:var(--up)}
.ro{background:var(--soft);color:var(--mut)}
.save{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;align-items:center}
.saved{font-size:13px;color:var(--up);margin-right:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}.toast.on{opacity:1}
@media(max-width:760px){.sheet,.edit{grid-template-columns:minmax(0,1fr)}.pic{max-width:420px}}
@media(max-width:480px){.facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.facts div:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line)}.tools{width:100%}.tools .btn{flex:1}}
</style>
</head>
<body>
<header class="hd"><div class="hb"><a href="index.html" class="logo">Pobres</a><div class="acct" id="acct"></div></div></header>
<div class="band"><img src="img/pobres-over30.png" alt="Pobres Over 30, 2026"></div>
<main class="w" id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script src="data/cidades.js"></script>
<script src="js/conta.js"></script>
<script>
{
const $=s=>document.querySelector(s),esc=Conta.esc;
const PERSON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4.2 4.6-6.3 8-6.3s6.5 2.1 8 6.3"/></svg>';
const ARR={up:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',dn:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>'};
let me=Conta.atual();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
const posicao=()=>{const us=Conta.users().slice().sort((a,b)=>a.criado-b.criado);return us.findIndex(u=>u.id===me.id)+1};
const data=iso=>{const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};

function bar(edit){return `<div class="bar"><div class="crumb"><a href="index.html">Pobres Over 30</a> / ${edit?'Editando minha página':'Minha página'}</div><div class="tools">${edit?'':`<a class="btn ghost" href="pessoa.html#${me.id}">Ver página pública</a><button class="btn" id="ed">Editar minha página</button><button class="btn ghost" id="out">Sair</button>`}</div></div>`}

function view(){
  me=Conta.atual();const cot=Conta.cotacao(me.id),hist=me.historia||me.bio||'';
  const ig=me.instagram?me.instagram.replace(/^@/,''):'';
  $('#app').innerHTML=bar(false)+`<section class="sheet">
    <div class="pic"><div class="ph">${me.foto?`<img src="${me.foto}" alt="Foto de ${esc(me.nome)}">`:PERSON}<span class="mk ${cot.dir}">${ARR[cot.dir]}${cot.dir==='up'?'+':'−'}${cot.pct}%</span></div></div>
    <div class="info">
      <span class="tag">Pobres Over 30 · 2026</span>
      <h1>${esc(me.nome)}</h1>
      <div class="meta"><span><b>${Conta.idade(me.nascimento)}</b> anos</span><span>${esc(me.cidade)}, ${me.uf}</span></div>
      <span class="area">${esc(me.area)}</span>
      ${me.frase?`<blockquote>“${esc(me.frase)}”</blockquote>`:`<blockquote class="empty">Sua frase de efeito aparece aqui.</blockquote>`}
      ${hist?`<p class="bio">${esc(hist)}</p>`:`<p class="bio empty">Conte como você chegou até aqui. Clique em Editar minha página.</p>`}
      ${ig?`<a class="ig" href="https://instagram.com/${encodeURIComponent(ig)}">@${esc(ig)}</a>`:''}
      <div class="facts"><div>Inscrito nº<b>${(1284+posicao()).toLocaleString("pt-BR")}</b></div><div>Cotação de hoje<b style="color:var(--${cot.dir})">${cot.dir==='up'?'Em alta':'Em baixa'}</b></div><div>Na lista desde<b>${new Date(me.criado).toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).replace('.','')}</b></div></div>
    </div></section>`;
  $('#ed').onclick=edit;
  $('#out').onclick=()=>{Conta.sair();location.href='index.html'};
}

function edit(){
  let foto=me.foto;
  $('#app').innerHTML=bar(true)+`<form class="edit" id="f" novalidate>
    <div class="pic"><div class="ph" id="pv">${foto?`<img src="${foto}" alt="">`:PERSON}</div>
      <span class="btn ghost fileb">Trocar foto<input type="file" id="fp" accept="image/*" aria-label="Trocar foto"></span>
      ${foto?'<button type="button" class="lnk" id="rm">Remover foto</button>':''}</div>
    <div>
      <div class="two eq"><label class="field"><span class="lb">Nome</span><input class="inp" id="pn" maxlength="30" value="${esc(me.primeiro||me.nome.split(' ')[0])}"></label><label class="field"><span class="lb">Sobrenome</span><input class="inp" id="sn" maxlength="40" value="${esc(me.sobrenome||me.nome.split(' ').slice(1).join(' '))}"></label></div>
      <div class="two eq"><div class="field"><span class="lb">Estado</span><div id="uf"></div></div><div class="field"><span class="lb">Cidade</span><div id="cid"></div></div></div>
      <div class="field"><span class="lb">Área de atuação</span><div id="area"></div></div>
      <label class="field"><span class="lb">Frase de efeito <span class="count" id="cf"></span></span><input class="inp" id="frase" maxlength="120" placeholder="Ex.: Não sou pobre, sou um investidor de longo prazo." value="${esc(me.frase)}"></label>
      <label class="field"><span class="lb">Sua história <span class="count" id="cb"></span></span><textarea class="inp" id="bio" maxlength="600" placeholder="Como você chegou até aqui?">${esc(me.historia||me.bio||'')}</textarea></label>
      <div class="sug"><div class="sug-h"><span>Histórias prontas para você</span><button type="button" class="lnk" id="regen">Gerar outras</button></div><div id="opts"></div></div>
      <div class="two" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><label class="field"><span class="lb">Instagram</span><input class="inp" id="ig" maxlength="31" placeholder="@seuperfil" value="${esc(me.instagram)}"></label><label class="field"><span class="lb">WhatsApp</span><input class="inp" id="wa" type="tel" inputmode="tel" value="${esc(me.whatsapp)}"></label></div>
      <div class="two" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><label class="field"><span class="lb">E-mail</span><input class="inp ro" value="${esc(me.email)}" readonly></label><label class="field"><span class="lb">Nascimento</span><input class="inp ro" value="${data(me.nascimento)}" readonly></label></div>
      <div class="hint" style="margin-top:-6px">E-mail e data de nascimento não podem ser alterados.</div>
      <div class="err" id="err"></div>
      <div class="save"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="sv">Salvar alterações</button></div>
    </div></form>`;
  const cs=PSelect($('#cid'),{items:Conta.cidades(me.uf),value:me.cidade,search:true,placeholder:'Selecione a cidade',label:'Cidade'});
  const uf=PSelect($('#uf'),{items:Conta.estados(),value:me.uf,search:true,label:'Estado',onChange:v=>{cs.setItems(Conta.cidades(v));cs.set(null);setTimeout(()=>cs.el.querySelector('.psel-btn').click(),60)}});
  const ar=PSelect($('#area'),{items:Conta.AREAS,value:me.area,search:true,label:'Área de atuação'});
  const cnt=(i,c,max)=>{const f=()=>$(c).textContent=`${$(i).value.length}/${max}`;$(i).oninput=f;f()};
  cnt('#frase','#cf',120);cnt('#bio','#cb',600);
  let opts=[];const ta=$('#bio');
  const paint=()=>{$('#opts').innerHTML=opts.map((t,i)=>`<button type="button" class="opt${ta.value===t?' on':''}" data-i="${i}"><span class="opt-n">Opção ${i+1}</span>${esc(t)}<span class="opt-c">${ta.value===t?'Selecionada':'Usar esta história'}</span></button>`).join('');$('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ta.value=opts[+b.dataset.i];ta.dispatchEvent(new Event('input'));paint()})};
  const gen=()=>{opts=Conta.historias({nascimento:me.nascimento,cidade:cs.value||me.cidade,uf:uf.value,area:ar.value},2);paint()};
  ta.addEventListener('input',paint);$('#regen').onclick=gen;gen();
  const wa=$('#wa');wa.oninput=()=>{let v=wa.value.replace(/\D/g,'').slice(0,11);wa.value=v.length>6?`(${v.slice(0,2)}) ${v.slice(2,v.length-4)}-${v.slice(-4)}`:v.length>2?`(${v.slice(0,2)}) ${v.slice(2)}`:v};
  $('#fp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{foto=await Conta.foto(f);$('#pv').innerHTML=`<img src="${foto}" alt="">`}catch(x){$('#err').textContent='Não deu pra ler essa imagem.'}};
  $('#rm')?.addEventListener('click',()=>{foto='';$('#pv').innerHTML=PERSON});
  $('#cancel').onclick=view;
  $('#f').onsubmit=e=>{
    e.preventDefault();$('#err').textContent='';
    const pn=$('#pn').value.trim(),sn=$('#sn').value.trim();
    if(!pn||!sn){$('#err').textContent='Digite nome e sobrenome.';(!pn?$('#pn'):$('#sn')).classList.add('bad');return}
    if(!cs.value){$('#err').textContent='Escolha a cidade.';cs.el.classList.add('bad');return}
    if(wa.value.replace(/\D/g,'').length<10){$('#err').textContent='Digite o WhatsApp com DDD.';wa.classList.add('bad');return}
    try{
      Conta.atualizar({primeiro:pn,sobrenome:sn,cidade:cs.value,uf:uf.value,area:ar.value,frase:$('#frase').value.trim(),historia:$('#bio').value.trim(),bio:'',instagram:$('#ig').value.trim(),whatsapp:wa.value,foto});
      Conta.header($('#acct'));view();toast('Página atualizada');window.scrollTo({top:0,behavior:'smooth'});
    }catch(x){$('#err').textContent=x.message}
  };
  $('#pn').focus();
}
if(!me)location.replace('entrar.html');else view();
}
</script>
</body>
</html>
